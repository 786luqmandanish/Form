<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title> 
</head> 
<body bgcolor="seagreen"> 
    <h1>BASIC CALCULATOR BY ONLY USING HTML</h1> 
    <form oninput="result.value = eval(num1.value + operator.value + num2.value)">
        <input type="number" id="num1" placeholder="Enter first number">
        <br>
        <br>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <br>
        <br>
        <input type="number" id="num2" placeholder="Enter second number">
        
        <br> = <br>
        
        <output name="result" id="result"></output>
    </form>
    
</body>  
</html>
